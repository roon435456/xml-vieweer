<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireball IP Cam Finder</title>
    <meta name="description" content="A UNSTYLED-No UI site that google dorks for you to find public IP Cams">
</head>
<body>
    <div class="container">
        <img id="fireballImg" src="Bog_fireball.gif" alt="Fireball" onerror="this.style.display='none'; document.getElementById('errorText').style.display='block';">
        <div id="errorText" style="display: none; color: red;">Error: Bog_fireball.gif not found</div>
        <div class="location-text">You shoot a fireball to see... <span id="location">All Locations</span></div>
        
        <div class="controls">
            <div class="toggle-container">
                <label for="randomizeToggle">Randomize Cams</label>
                <input type="checkbox" id="randomizeToggle" checked>
            </div>
            
            <div class="toggle-container">
                <label for="liveOnlyToggle">Live Cams Only</label>
                <input type="checkbox" id="liveOnlyToggle" checked>
            </div>
            
            <div class="country-selector">
                <label for="countrySelect">Country:</label>
                <select id="countrySelect">
                    <option value="all">All Countries</option>
                    <option value="japan">Japan</option>
                    <option value="usa">USA</option>

                    <option value="china">China</option>
                    <option value="india">India</option>
                    <option value="brazil">Brazil</option>
                    <option value="egypt">Egypt</option>
                    <option value="canada">Canada</option>
                    <option value="korea">South Korea</option>
                    <option value="mexico">Mexico</option>
                    <option value="uae">UAE</option>
                    <option value="singapore">Singapore</option>
                    <option value="italy">Italy</option>
                    <option value="spain">Spain</option>
                    <option value="netherlands">Netherlands</option>
                    <option value="thailand">Thailand</option>
                </select>
            </div>
            
            <button id="searchButton" class="here-button">Search</button>
            <button id="refreshButton" class="refresh-button">Refresh</button>
        </div>
        
        <div id="results" class="hidden">
            <p>Searching for IP cameras in <span id="searchLocation"></span>...</p>
            <div id="cameraResults"></div>
        </div>
    </div>
