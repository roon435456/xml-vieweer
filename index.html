<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPSS Lite Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #333; font-weight: bold; font-size: 16px; background: #252525; }
        .device-list { flex: 1; overflow-y: auto; padding: 10px; }
        .device-item { padding: 10px; margin-bottom: 5px; background: #2a2a2a; border-radius: 4px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .device-item:hover { background: #333; border-color: #007bff; }
        .device-item.active { background: #007bff; color: white; }
        .main-view { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; }
        .video-container { flex: 1; display: flex; items-center: center; justify-content: center; background: #000; position: relative; padding: 20px; }
        .video-box { width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #151515; border: 2px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; }
        .live-indicator { background: red; color: white; padding: 3px 8px; border-radius: 3px; font-size: 12px; font-weight: bold; margin-bottom: 15px; animation: blink 1.5s infinite; }
        .cam-title { font-size: 24px; margin-bottom: 10px; color: #fff; }
        .cam-details { color: #888; font-family: monospace; font-size: 14px; text-align: center; line-height: 1.6; }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">Devices (${devices.length})</div>
        <div class="device-list" id="deviceList"></div>
    </div>

    <div class="main-view">
        <div class="video-container">

                <div class="cam-title" id="viewName">Select a camera</div>
                <div class="cam-details" id="viewDetails">Click a device on the left to view connection parameters.</div>

    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlData, "text/xml");
        const devices = xmlDoc.getElementsByTagName("Device");
        const listContainer = document.getElementById('deviceList');
        
        document.querySelector('.sidebar-header').textContent = `Devices (${devices.length})`;

        // Build list elements
        for (let i = 0; i < devices.length; i++) {
            const name = devices[i].getAttribute("name");
            const domain = devices[i].getAttribute("domain");
            const port = devices[i].getAttribute("port");
            const user = devices[i].getAttribute("username");

            const item = document.createElement('div');
            item.className = 'device-item';
            item.textContent = name;
            
            // Handle clicking item to display live simulation
            item.addEventListener('click', () => {
                document.querySelectorAll('.device-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                updateActiveView(name, domain, port, user);
            });

            listContainer.appendChild(item);
        }

        // Auto-select and display FCAM_0001 initially
        if (devices.length > 0) {
            listContainer.children[0].classList.add('active');
            const first = devices[0];
            updateActiveView(
                first.getAttribute("name"),
                first.getAttribute("domain"),
                first.getAttribute("port"),
                first.getAttribute("username")
            );
        }
    });

    // Function to change screen info
    function updateActiveView(name, domain, port, user) {
        document.getElementById('liveTag').style.display = 'block';
        document.getElementById('viewName').textContent = name;
        document.getElementById('viewDetails').innerHTML = `
            Domain/IP: ${domain}<br>
            Port: ${port}<br>
            User: ${user}<br>
            Status: Connecting Stream...
        `;
    }
